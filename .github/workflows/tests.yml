name: Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  # Run on demand, e.g. to re-check the acceptance suites after a dependency of
  # theirs is deployed, without pushing a commit to do it.
  workflow_dispatch:
    inputs:
      suite:
        description: Which acceptance suite to run
        type: choice
        default: all
        options:
          - all
          - product-site
          - admin-site

concurrency:
  # Manual runs are keyed separately so dispatching one does not cancel the
  # pull-request run on the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions: {}

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: ./.github/actions/setup-go

      - name: Run unit tests
        run: make test-unit

  acceptance-tests:
    name: Acceptance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: acceptance-tests
    permissions:
      contents: read
      id-token: write # Required for GitHub OIDC
    # OIDC and the test-environment secrets are unavailable to fork and Dependabot
    # PRs; push-to-main runs always have them.
    if: >-
      (github.event_name != 'pull_request' ||
       (github.actor != 'dependabot[bot]' &&
        github.event.pull_request.head.repo.full_name == github.repository)) &&
      (github.event_name != 'workflow_dispatch' ||
       contains(fromJSON('["all", "product-site"]'), inputs.suite))
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: ./.github/actions/setup-go

      - name: Setup Terraform
        uses: ./.github/actions/setup-terraform

      - name: Get GitHub OIDC token
        id: oidc
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const token = await core.getIDToken('${{ secrets.BEYONDTRUST_SITE_ID }}')
            core.setOutput('token', token)

      - name: Run acceptance tests
        run: make test-acc
        env:
          BEYONDTRUST_ACCESS_TOKEN: ${{ steps.oidc.outputs.token }}
          BEYONDTRUST_SITE_ID: ${{ secrets.BEYONDTRUST_SITE_ID }}
          BEYONDTRUST_SERVICE_NAME: ${{ secrets.BEYONDTRUST_SERVICE_NAME }}
          BEYONDTRUST_TEST_AWS_ROLE_ARN: ${{ secrets.BEYONDTRUST_TEST_AWS_ROLE_ARN }}
          BEYONDTRUST_TEST_AWS_ROLE_ARN_2: ${{ secrets.BEYONDTRUST_TEST_AWS_ROLE_ARN_2 }}
          BEYONDTRUST_TEST_AWS_TARGET_ROLE_ARN: ${{ secrets.BEYONDTRUST_TEST_AWS_TARGET_ROLE_ARN }}
          TF_ACC: "1"


  acceptance-tests-admin:
    name: Acceptance Tests (admin site)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: acceptance-tests-admin
    permissions:
      contents: read
      id-token: write # Required for GitHub OIDC
    # Skip on fork/Dependabot PRs, which can't access environment secrets or OIDC.
    if: >-
      (github.event_name != 'pull_request' ||
       (github.actor != 'dependabot[bot]' &&
        github.event.pull_request.head.repo.full_name == github.repository)) &&
      (github.event_name != 'workflow_dispatch' ||
       contains(fromJSON('["all", "admin-site"]'), inputs.suite))
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: ./.github/actions/setup-go

      - name: Setup Terraform
        uses: ./.github/actions/setup-terraform

      - name: Get OIDC token
        id: oidc
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const token = await core.getIDToken('${{ secrets.BEYONDTRUST_ADMIN_SITE_ID }}')
            core.setOutput('token', token)

      - name: Run workload-identity acceptance tests
        run: make test-acc-admin
        env:
          BEYONDTRUST_ADMIN_SITE_ID: ${{ secrets.BEYONDTRUST_ADMIN_SITE_ID }}
          BEYONDTRUST_ADMIN_ACCESS_TOKEN: ${{ steps.oidc.outputs.token }}
          BEYONDTRUST_SERVICE_NAME: ${{ secrets.BEYONDTRUST_SERVICE_NAME }}
          TF_ACC: "1"

      # A second token, scoped to the product site, so the enforcement tests can seed fixtures and
      # act as the low-privilege principal. Same OIDC identity, different audience.
      - name: Get product-site OIDC token scoped to a single product and site
        id: oidc-product
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const token = await core.getIDToken('${{ secrets.BEYONDTRUST_SITE_ID }}')
            core.setOutput('token', token)

      # Policies are authored against the admin site, so they belong in this job.
      # The enforcement tests need two product-site identities — an owner to seed fixtures and a
      # low-privilege principal — each selected by service name. Without them they skip and say so.
      # BEYONDTRUST_SERVICE_NAME stays the admin identity here: the provider and the admin client
      # both use it, so the owner needs its own variable rather than sharing that one.
      - name: Run IAM policy acceptance tests
        run: make test-acc-policy
        env:
          BEYONDTRUST_ADMIN_SITE_ID: ${{ secrets.BEYONDTRUST_ADMIN_SITE_ID }}
          BEYONDTRUST_ADMIN_ACCESS_TOKEN: ${{ steps.oidc.outputs.token }}
          BEYONDTRUST_SITE_ID: ${{ secrets.BEYONDTRUST_SITE_ID }}
          BEYONDTRUST_TEST_POLICY_PRINCIPAL: ${{ secrets.BEYONDTRUST_TEST_POLICY_PRINCIPAL }}
          BEYONDTRUST_SERVICE_NAME: ${{ secrets.BEYONDTRUST_SERVICE_NAME }}
          # Optional: enable the enforcement tests. The principal is selected by service name,
          # reusing the product-site token, so neither needs a long-lived credential.
          BEYONDTRUST_ACCESS_TOKEN: ${{ steps.oidc-product.outputs.token }}
          BEYONDTRUST_TEST_POLICY_OWNER_SERVICE_NAME: ${{ secrets.BEYONDTRUST_TEST_POLICY_OWNER_SERVICE_NAME }}
          BEYONDTRUST_TEST_POLICY_PRINCIPAL_SERVICE_NAME: ${{ secrets.BEYONDTRUST_TEST_POLICY_PRINCIPAL_SERVICE_NAME }}
          # The folder the owner identity owns and seeds fixtures inside. A workload identity is
          # created with no product permissions, so without this the fixtures land at the product
          # root and are refused. See iam/README.md for the one-time grant.
          BEYONDTRUST_TEST_POLICY_FIXTURE_ROOT: ${{ vars.BEYONDTRUST_TEST_POLICY_FIXTURE_ROOT }}
          BEYONDTRUST_TEST_REQUIRE_ACC: "1"
          TF_ACC: "1"

      # Dynamic credential generation is gated on can_generate_dynamic_credential, which
      # product admins hold implicitly and CI does not. These tests grant it to themselves,
      # which needs the admin identity to write the policy and the principal identity to run
      # the ephemeral resource — the same identities the step above uses, and the reason this
      # suite lives here rather than in the product-site job.
      - name: Run dynamic credential ephemeral acceptance tests
        run: make test-acc-ephemeral
        env:
          BEYONDTRUST_ADMIN_SITE_ID: ${{ secrets.BEYONDTRUST_ADMIN_SITE_ID }}
          BEYONDTRUST_ADMIN_ACCESS_TOKEN: ${{ steps.oidc.outputs.token }}
          BEYONDTRUST_SITE_ID: ${{ secrets.BEYONDTRUST_SITE_ID }}
          BEYONDTRUST_ACCESS_TOKEN: ${{ steps.oidc-product.outputs.token }}
          BEYONDTRUST_SERVICE_NAME: ${{ secrets.BEYONDTRUST_SERVICE_NAME }}
          BEYONDTRUST_TEST_POLICY_PRINCIPAL: ${{ secrets.BEYONDTRUST_TEST_POLICY_PRINCIPAL }}
          BEYONDTRUST_TEST_POLICY_PRINCIPAL_SERVICE_NAME: ${{ secrets.BEYONDTRUST_TEST_POLICY_PRINCIPAL_SERVICE_NAME }}
          # The folder the dynamic secret is seeded into, and the scope of the grant that
          # lets the principal create it there. Folder-scoped because this caller cannot
          # write Product-scoped grants.
          BEYONDTRUST_TEST_POLICY_FIXTURE_ROOT: ${{ vars.BEYONDTRUST_TEST_POLICY_FIXTURE_ROOT }}
          BEYONDTRUST_TEST_AWS_ROLE_ARN: ${{ secrets.BEYONDTRUST_TEST_AWS_ROLE_ARN }}
          BEYONDTRUST_TEST_AWS_TARGET_ROLE_ARN: ${{ secrets.BEYONDTRUST_TEST_AWS_TARGET_ROLE_ARN }}
          # Mapped ahead of the secrets existing in this environment. They are defined on
          # acceptance-tests, and environment secrets do not cross environments, so until
          # they are added here the Azure tests skip — which the suite reports rather than
          # passing over. Adding them then needs no change to this file.
          BEYONDTRUST_TEST_AZURE_TENANT_ID: ${{ secrets.BEYONDTRUST_TEST_AZURE_TENANT_ID }}
          BEYONDTRUST_TEST_AZURE_CLIENT_ID: ${{ secrets.BEYONDTRUST_TEST_AZURE_CLIENT_ID }}
          BEYONDTRUST_TEST_AZURE_CLIENT_SECRET: ${{ secrets.BEYONDTRUST_TEST_AZURE_CLIENT_SECRET }}
          BEYONDTRUST_TEST_AZURE_APPLICATION_OBJECT_ID: ${{ secrets.BEYONDTRUST_TEST_AZURE_APPLICATION_OBJECT_ID }}
          BEYONDTRUST_TEST_REQUIRE_ACC: "1"
          TF_ACC: "1"
